name: "Publish Chord CLI Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare tag and package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

  verify:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  build-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Asset names must stay in sync with src/Utils/releaseAssets.ts and with DisChord-Server.
        include:
          - platform: "macos-latest"
            bun-target: "bun-darwin-arm64"
            asset: "chord-aarch64-apple-darwin"
          - platform: "macos-latest"
            bun-target: "bun-darwin-x64"
            asset: "chord-x86_64-apple-darwin"
          - platform: "ubuntu-latest"
            bun-target: "bun-linux-x64"
            asset: "chord-x86_64-unknown-linux-gnu"
          - platform: "ubuntu-latest"
            bun-target: "bun-linux-arm64"
            asset: "chord-aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            bun-target: "bun-windows-x64"
            asset: "chord-x86_64-pc-windows-msvc.exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Binary
        shell: bash
        env:
          BUN_TARGET: ${{ matrix.bun-target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          bun build ./src/index.ts --compile --target="$BUN_TARGET" --outfile "./dist/$ASSET"

      - name: Codesign (ad-hoc)
        if: matrix.platform == 'macos-latest'
        run: |
          codesign --force --deep --sign - dist/*

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.bun-target }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-binaries
          merge-multiple: true

      - name: Generate checksums
        working-directory: all-binaries
        run: sha256sum chord-* > SHA256SUMS

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: all-binaries/*
          tag_name: ${{ github.ref_name }}
          name: "Chord CLI Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-server:
    needs: publish-release
    uses: DisChord-Org/.github/.github/workflows/notify_server.yml@7607dfb8a9d06d8963179085158c3b7d3826d127 # v1.1
    secrets:
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
