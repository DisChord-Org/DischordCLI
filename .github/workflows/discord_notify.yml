name: Discord Notifier

on:
  push:
    branches:
      - '**'

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Nuevo push en ${{ github.repository }} (${{ github.ref_name }})"
          color: 0x2ecc71
          url: "${{ github.event.head_commit.url }}"
          username: "GitHub - DisChord Org."
          avatar_url: "https://github.com/DisChord-Org.png"
